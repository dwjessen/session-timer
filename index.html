<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Session Timer – Free Online Countdown Timer for Therapy, Clinics & Focus Sessions</title>
  <meta name="description" content="A free, calming online session timer designed for therapy sessions, psychology clinics, coaching, meditation, focus work, and more. Visual countdown with no sign-up required." />
  <meta name="keywords" content="session timer, therapy session timer, psychology clinic timer, counselling timer, coaching timer, countdown timer, online timer, focus timer, meditation timer, pomodoro, CBT session timer, treatment session timer, appointment timer, consulting timer" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph (for sharing on social media) -->
  <meta property="og:title" content="Session Timer – Free Online Countdown Timer for Therapy & Focus Sessions" />
  <meta property="og:description" content="A free, calming online session timer for therapy, psychology clinics, coaching, meditation, and focused work. Beautiful visual countdown, no sign-up needed." />
  <meta property="og:type" content="website" />

  <!-- Canonical URL (update with your actual domain) -->
  <link rel="canonical" href="https://dwjessen.github.io/session-timer/" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', Candara, 'Segoe UI', sans-serif;
      background: #87c474;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(3rem, 9vmin, 9rem);
      min-height: 100vh;
      padding-bottom: 90px;  
    }

    .progress-ring {
      width: min(80vw, 55vh);
      height: min(80vw, 55vh);
    }

    .progress-ring svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .controls {
      display: flex;
      gap: clamp(0.5rem, 2vmin, 1rem);
    }

    button {
      padding: 1vmin 2.5vmin;
      border: none;
      border-radius: 8px;
      font-family: 'Nunito', Candara, 'Segoe UI', sans-serif;
      font-size: clamp(0.8rem, 2.2vmin, 1.2rem);
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:active { transform: scale(0.96); }
    button:disabled { opacity: 0.3; cursor: not-allowed; }

    #watermark-container {
      position: fixed;
      top: 1rem;
      left: 1rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      opacity: 0.3;
    }

    #watermark {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
    }

    #watermark-title {
      font-family: 'Nunito', Candara, 'Segoe UI', sans-serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: white;
      white-space: nowrap;
    }

    #btn-start  { background: #69a656; color: #fff; }
    #btn-pause  { background: #48524a; color: #fff; opacity: 0.5 ;}
    #btn-reset  { background: #48524a; color: #fff; }

    .preset-row {
      display: flex;
      gap: clamp(0.4rem, 1.5vmin, 0.7rem);
      flex-wrap: wrap;
      justify-content: center;
      padding: 0 1rem;
    }

    .preset-row button {
      padding: 0.8vmin 2vmin;
      font-size: clamp(0.75rem, 2vmin, 1.1rem);
      background: #48524a;
      color: #d1d5db;
      border-radius: 20px;
    }

    .preset-row button:hover { background: #578a48; }
    .preset-row button.active { background: #578a48; color: #fff; }

    #btn-fullscreen {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      cursor: pointer;
      opacity: 0.3;
      padding: 0;
      width: 42px;
      height: 42px;
      transition: opacity 0.2s;
    }

    #btn-fullscreen:hover { opacity: 0.7; }

    #ad-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 90px;
      background: rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.25);
    }

</style>
</head>
<body>

<button id="btn-fullscreen" title="Toggle fullscreen">
  <svg id="icon-expand" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
    <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
  </svg>
  <svg id="icon-compress" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
    <polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/>
    <line x1="10" y1="14" x2="3" y2="21"/><line x1="21" y1="3" x2="14" y2="10"/>
  </svg>
</button>

  <!-- WATERMARK: replace the svg below with <img id="watermark" src="your-logo.png" /> to use a custom image -->
<div id="watermark-container">
  <svg id="watermark" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/>
    <polyline points="12 6 12 12 16 14"/>
  </svg>
  <span id="watermark-title">Session Timer</span>
</div>

<div class="preset-row" id="preset-row">
    <button onclick="setPreset(10*60, this)">10 min</button>
    <button onclick="setPreset(15*60, this)">15 min</button>
    <button onclick="setPreset(30*60, this)">30 min</button>
    <button id="btn-50" onclick="setPreset(50*60, this)">50 min</button>
    <button id="btn-custom" onclick="toggleCustom(this)">Custom</button>
  </div>
  <div id="custom-row" style="display:none; align-items:center; gap:0.6rem;">
    <input id="custom-input" type="number" min="1" placeholder="minutes"
           style="width:90px; padding:0.5rem; border-radius:8px; border:none; background:#48524a; color:#fff; font-family:inherit; font-size:1rem; text-align:center;" />
  </div>

  <div class="progress-ring" style="position:relative;width:260px;height:260px;">
    <svg id="ring-svg" viewBox="0 0 260 260">
      <circle id="ring-track" cx="130" cy="130" r="120" fill="none" stroke="#87c474" stroke-width="12"/>
      <circle id="ring" cx="130" cy="130" r="120" fill="none"
              stroke="#6ee7b7" stroke-width="12"
              stroke-dasharray="753.98"
              stroke-dashoffset="0"
              stroke-linecap="round"/>
    </svg>
    <div id="ring-timer" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(255,255,255,0.3);font-family:'Nunito',Candara,'Segoe UI',sans-serif;font-size:clamp(1rem,5vmin,2rem);font-weight:600;letter-spacing:0.05em;pointer-events:none;">50:00</div>

    <svg id="pause-symbol" viewBox="0 0 260 260"
         style="position:absolute;top:0;left:0;width:100%;height:100%;display:none;">
      <rect x="80" y="80" width="100" height="100" rx="10" fill="#c47e7e"/>
    </svg>
  </div>

  <div class="controls">
    <button id="btn-start">Start</button>
    <button id="btn-pause" disabled>Pause</button>
    <button id="btn-reset">Reset</button>
  </div>



  <script>
    const CIRCUMFERENCE = 2 * Math.PI * 120; // 753.98

    let totalSeconds = 0;
    let remaining   = 0;
    let interval    = null;
    let running     = false;

    const ring      = document.getElementById('ring');
    const ringTrack = document.getElementById('ring-track');
    const btnStart  = document.getElementById('btn-start');
    const btnPause  = document.getElementById('btn-pause');
    const btnReset  = document.getElementById('btn-reset');
    const presetRow = document.getElementById('preset-row');

    function setRunningUI(isRunning) {
      const hide = isRunning ? 'hidden' : 'visible';
      btnStart.style.visibility  = hide;
      btnReset.style.visibility  = hide;
      presetRow.style.visibility = hide;
      if (isRunning) document.getElementById('custom-row').style.display = 'none';
      const ad = document.getElementById('ad-banner');
      if (ad) ad.style.display = isRunning ? 'none' : 'flex';
    }

    const BG_STOPS = ['#87c474', '#c0c474', '#c49074'];

    function darken(rgb, amount) {
      const m = rgb.match(/\d+/g).map(Number);
      return `rgb(${m.map(c => Math.max(0, c - amount)).join(',')})`;
    }

    function lerpColor(a, b, t) {
      const parse = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
      const [ar,ag,ab] = parse(a), [br,bg,bb] = parse(b);
      return `rgb(${Math.round(ar+(br-ar)*t)},${Math.round(ag+(bg-ag)*t)},${Math.round(ab+(bb-ab)*t)})`;
    }

    // positions: where each stop sits in the 0-1 progress range
    function multiStop(stops, positions, t) {
      for (let i = 0; i < positions.length - 1; i++) {
        if (t <= positions[i + 1]) {
          const seg = (t - positions[i]) / (positions[i + 1] - positions[i]);
          return lerpColor(stops[i], stops[i + 1], seg);
        }
      }
      return stops[stops.length - 1];
    }

    function updateUI() {
      const pct = totalSeconds > 0 ? remaining / totalSeconds : 1;
      ring.style.strokeDashoffset = CIRCUMFERENCE * (1 - pct);

      // progress = 0 at full time, 1 at zero — drives color from green to red
      const progress = 1 - pct;
      const bg = multiStop(BG_STOPS, [0, 0.7, 1], progress);
      document.body.style.backgroundColor = bg;
      ringTrack.style.stroke = bg;
      ring.style.stroke = darken(bg, 30);

      const m = Math.floor(remaining / 60).toString().padStart(2, '0');
      const s = (remaining % 60).toString().padStart(2, '0');
      document.getElementById('ring-timer').textContent = `${m}:${s}`;
    }

    function setTime(seconds) {
      stop();
      totalSeconds = seconds;
      remaining    = seconds;

      updateUI();
    }

    function setPreset(s, btn) {
      document.querySelectorAll('#preset-row button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('custom-row').style.display = 'none';
      setTime(s);
    }

    function toggleCustom(btn) {
      document.querySelectorAll('#preset-row button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const row = document.getElementById('custom-row');
      row.style.display = 'flex';
      document.getElementById('custom-input').focus();
    }

    function applyCustom() {
      const mins = parseInt(document.getElementById('custom-input').value);
      if (!mins || mins < 1) return;
      setTime(mins * 60);
    }

    document.getElementById('custom-input').addEventListener('input', applyCustom);

    function start() {
      if (remaining <= 0) return;
      running = true;
      btnStart.disabled = true;
      btnPause.disabled = false;

      setRunningUI(true);

      interval = setInterval(() => {
        remaining--;
        updateUI();
        if (remaining <= 0) {
          clearInterval(interval);
          running = false;
          btnStart.disabled = false;
          btnPause.disabled = true;
          setRunningUI(false);
          notifyDone();
        }
      }, 1000);
    }

    function pause() {
      clearInterval(interval);
      running = false;
      btnStart.disabled = false;
      btnPause.disabled = true;
      btnStart.textContent = 'Resume';
      setRunningUI(false);
    }

    function stop() {
      clearInterval(interval);
      running = false;
      btnStart.disabled = false;
      btnPause.disabled = true;
      btnStart.textContent = 'Start';
      setRunningUI(false);
    }

    function reset() {
      stop();
      remaining = totalSeconds;
      document.getElementById('ring-svg').style.display = 'block';
      document.getElementById('pause-symbol').style.display = 'none';
      updateUI();
    }

    function notifyDone() {
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('Session Timer', { body: 'Your time is up!' });
      }
      document.getElementById('ring-svg').style.display = 'none';
      document.getElementById('pause-symbol').style.display = 'block';
      document.body.style.backgroundColor = '#e09f9f';

      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        // Pentatonic wind chime notes (G5, A5, B5, D6, E6, G6)
        const notes = [784, 880, 988, 1175, 1319, 1568];
        const strikes = [0, 0.3, 0.55, 0.9, 1.2, 1.6, 2.1, 2.5];
        strikes.forEach((t, i) => {
          const freq = notes[Math.floor(i * notes.length / strikes.length)];
          // Fundamental + inharmonic partial (metal tube character)
          [[freq, 0.15], [freq * 2.756, 0.05]].forEach(([f, vol]) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.type = 'sine';
            o.frequency.value = f;
            const ts = ctx.currentTime + t;
            g.gain.setValueAtTime(vol, ts);
            g.gain.exponentialRampToValueAtTime(0.0001, ts + 2.5);
            o.start(ts);
            o.stop(ts + 2.5);
          });
        });
      } catch(e) {}
    }

    btnStart.addEventListener('click', start);

    document.getElementById('btn-fullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    });

    document.addEventListener('fullscreenchange', () => {
      const fs = !!document.fullscreenElement;
      document.getElementById('icon-expand').style.display   = fs ? 'none'  : 'block';
      document.getElementById('icon-compress').style.display = fs ? 'block' : 'none';
    });
    btnPause.addEventListener('click', pause);
    btnReset.addEventListener('click', reset);

// Request notification permission on load
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }

    // Default to 50 min
    const defaultBtn = document.getElementById('btn-50');
    defaultBtn.classList.add('active');
    setTime(50 * 60);
  </script>

<div id="ad-banner">Advertisement</div>

</body>
</html>
