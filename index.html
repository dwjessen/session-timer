<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Session Timer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 1.4rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 2rem;
    }

    .progress-ring {
      margin: 2rem auto;
    }

    .progress-ring svg {
      transform: rotate(-90deg);
    }

    .controls {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
    }

    button {
      padding: 0.7rem 2rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:active { transform: scale(0.96); }
    button:disabled { opacity: 0.3; cursor: not-allowed; }

    #btn-start  { background: #6ee7b7; color: #0f0f1a; }
    #btn-pause  { background: #f59e0b; color: #0f0f1a; }
    #btn-reset  { background: #374151; color: #fff; }

    .preset-row {
      display: flex;
      gap: 0.6rem;
      margin-top: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .preset-row button {
      padding: 0.4rem 1.1rem;
      font-size: 0.85rem;
      background: #1f2937;
      color: #d1d5db;
      border-radius: 20px;
    }

    .preset-row button:hover { background: #374151; }
    .preset-row button.active { background: #6ee7b7; color: #0f0f1a; }

.message {
      margin-top: 1.5rem;
      font-size: 1.1rem;
      color: #ef4444;
      font-weight: 600;
      min-height: 1.5rem;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <h1>Session Timer</h1>

  <div class="progress-ring">
    <svg id="ring-svg" width="260" height="260" viewBox="0 0 260 260">
      <circle cx="130" cy="130" r="120" fill="none" stroke="#1f2937" stroke-width="12"/>
      <circle id="ring" cx="130" cy="130" r="120" fill="none"
              stroke="#6ee7b7" stroke-width="12"
              stroke-dasharray="753.98"
              stroke-dashoffset="0"
              stroke-linecap="round"/>
    </svg>
  </div>

  <div class="controls">
    <button id="btn-start">Start</button>
    <button id="btn-pause" disabled>Pause</button>
    <button id="btn-reset">Reset</button>
  </div>

  <div class="preset-row" id="preset-row">
    <button onclick="setPreset(10, this)">10 sec</button>
    <button onclick="setPreset(5*60, this)">5 min</button>
    <button onclick="setPreset(10*60, this)">10 min</button>
    <button onclick="setPreset(15*60, this)">15 min</button>
    <button onclick="setPreset(25*60, this)">25 min</button>
    <button onclick="setPreset(45*60, this)">45 min</button>
    <button onclick="setPreset(60*60, this)">1 hr</button>
    <button onclick="setPreset(90*60, this)">1.5 hr</button>
    <button onclick="setPreset(2*60*60, this)">2 hr</button>
  </div>


<div class="message" id="message"></div>

  <script>
    const CIRCUMFERENCE = 2 * Math.PI * 120; // 753.98

    let totalSeconds = 0;
    let remaining   = 0;
    let interval    = null;
    let running     = false;

    const ring     = document.getElementById('ring');
    const message  = document.getElementById('message');
    const btnStart = document.getElementById('btn-start');
    const btnPause = document.getElementById('btn-pause');
    const btnReset = document.getElementById('btn-reset');

    // Interpolate through [green → amber → red] stops over the full duration
    const RING_STOPS = ['#6ee7b7', '#f59e0b', '#ef4444'];
    const BG_STOPS   = ['#87c474', '#c0c474', '#c49d74'];

    function lerpColor(a, b, t) {
      const parse = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
      const [ar,ag,ab] = parse(a), [br,bg,bb] = parse(b);
      return `rgb(${Math.round(ar+(br-ar)*t)},${Math.round(ag+(bg-ag)*t)},${Math.round(ab+(bb-ab)*t)})`;
    }

    // positions: where each stop sits in the 0-1 progress range
    function multiStop(stops, positions, t) {
      for (let i = 0; i < positions.length - 1; i++) {
        if (t <= positions[i + 1]) {
          const seg = (t - positions[i]) / (positions[i + 1] - positions[i]);
          return lerpColor(stops[i], stops[i + 1], seg);
        }
      }
      return stops[stops.length - 1];
    }

    function updateUI() {
      const pct = totalSeconds > 0 ? remaining / totalSeconds : 1;
      ring.style.strokeDashoffset = CIRCUMFERENCE * (1 - pct);

      // progress = 0 at full time, 1 at zero — drives color from green to red
      const progress = 1 - pct;
      ring.style.stroke = multiStop(RING_STOPS, [0, 0.5, 1], progress);
      document.body.style.backgroundColor = multiStop(BG_STOPS, [0, 0.7, 1], progress);
    }

    function setTime(seconds) {
      stop();
      totalSeconds = seconds;
      remaining    = seconds;
      message.textContent = '';
      updateUI();
    }

    function setPreset(s, btn) {
      document.querySelectorAll('#preset-row button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      setTime(s);
    }

    function start() {
      if (remaining <= 0) return;
      running = true;
      btnStart.disabled = true;
      btnPause.disabled = false;
      message.textContent = '';

      interval = setInterval(() => {
        remaining--;
        updateUI();
        if (remaining <= 0) {
          clearInterval(interval);
          running = false;
          btnStart.disabled = false;
          btnPause.disabled = true;
          message.textContent = 'Time is up!';
          notifyDone();
        }
      }, 1000);
    }

    function pause() {
      clearInterval(interval);
      running = false;
      btnStart.disabled = false;
      btnPause.disabled = true;
      btnStart.textContent = 'Resume';
    }

    function stop() {
      clearInterval(interval);
      running = false;
      btnStart.disabled = false;
      btnPause.disabled = true;
      btnStart.textContent = 'Start';
    }

    function reset() {
      stop();
      remaining = totalSeconds;
      message.textContent = '';
      updateUI();
    }

    function notifyDone() {
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('Session Timer', { body: 'Your time is up!' });
      }

      const beepTimes = [0, 300, 600, 900, 1200, 1500, 1800, 2100, 2400]; // ms
      const beepDuration = 250; // ms

      // Flash background in sync with each beep
      beepTimes.forEach(t => {
        setTimeout(() => {
          document.body.style.backgroundColor = '#d47979';
          setTimeout(() => {
            document.body.style.backgroundColor = '#c49d74';
          }, beepDuration);
        }, t);
      });

      // Play beeps
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        beepTimes.forEach(t => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.frequency.value = 880;
          const ts = ctx.currentTime + t / 1000;
          g.gain.setValueAtTime(0.3, ts);
          g.gain.exponentialRampToValueAtTime(0.001, ts + 0.25);
          o.start(ts);
          o.stop(ts + 0.25);
        });
      } catch(e) {}
    }

    btnStart.addEventListener('click', start);
    btnPause.addEventListener('click', pause);
    btnReset.addEventListener('click', reset);

// Request notification permission on load
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }

    // Init display
    updateUI();
  </script>
</body>
</html>
